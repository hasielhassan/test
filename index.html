<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Collaborative Canvas: Robust</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            touch-action: none;
            display: block;
            background: #fff;
            cursor: crosshair;
        }

        /* --- UI CONTAINER --- */
        #ui {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.98);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 200px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 10;
        }

        /* --- BUTTONS & INPUTS --- */
        button {
            cursor: pointer;
            padding: 10px;
            border: 1px solid #ddd;
            background: #f5f5f5;
            border-radius: 6px;
            width: 100%;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #e0e0e0;
        }

        .btn-primary {
            background: #2196F3;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #1976D2;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            color: #444;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 30px;
            cursor: pointer;
            background: none;
        }

        /* --- STATUS & USER LIST --- */
        #status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s;
        }

        .connected {
            background: #4CAF50;
            box-shadow: 0 0 6px #4CAF50;
        }
        
        .error-dot {
            background: #f44336;
            box-shadow: 0 0 6px #f44336;
        }

        #userList {
            margin-top: 5px;
            font-size: 12px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 4px;
            color: #444;
            padding: 2px 0;
        }

        .user-color-indicator {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            border: 1px solid #ddd;
        }

        .hints {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
            line-height: 1.4;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }
        
        #errorMsg {
            color: #f44336;
            font-size: 11px;
            display: none;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div id="ui">
        <div id="status">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Initializing...</span>
        </div>
        <div id="errorMsg"></div>
        <div style="font-size:10px; color:#999; margin-bottom:5px; word-break: break-all;" id="peerIdDisplay"></div>

        <div class="color-row">
            <span>Brush Color:</span>
            <input type="color" id="colorPicker" value="#000000">
        </div>

        <button onclick="copyLink()">🔗 Copy Link</button>
        <button onclick="clearCanvas()">🧹 Clear Canvas</button>
        <button onclick="newSession()" class="btn-primary">✨ New Session</button>

        <div id="userList">
            <strong>Participants:</strong>
            <div id="usersContainer"></div>
        </div>

        <div class="hints">
            <b>Controls:</b><br>
            • Draw: Left Click / Touch<br>
            • Pan: Middle Click / 2 Fingers<br>
            • Zoom: Wheel / Pinch
        </div>
    </div>

    <canvas id="c"></canvas>

    <script type="module">
        import * as Y from 'https://esm.sh/yjs@13.6.8';

        // --- 1. USER IDENTITY SYSTEM ---
        const ADJECTIVES = ['Neon', 'Crimson', 'Azure', 'Golden', 'Silent', 'Brave', 'Cosmic', 'Swift'];
        const ANIMALS = ['Fox', 'Tiger', 'Bear', 'Eagle', 'Panda', 'Wolf', 'Hawk', 'Badger'];

        function getRandomName() {
            const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
            const anim = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
            return `${adj} ${anim}`;
        }

        const defaultName = getRandomName();
        // Simple check to avoid prompt if just reloading
        const userName = sessionStorage.getItem('userName') || prompt("Enter your name:", defaultName) || defaultName;
        sessionStorage.setItem('userName', userName);
        
        const userUiColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');

        const currentUser = {
            name: userName,
            uiColor: userUiColor,
            isSelf: true
        };

        // --- 2. CONFIGURATION & YJS SETUP ---
        const urlParams = new URLSearchParams(window.location.search);
        let hostId = urlParams.get('id');
        const isHost = !hostId;

        const doc = new Y.Doc();
        const yStrokes = doc.getArray('strokes');
        const yUsers = doc.getMap('users'); 

        // --- 3. ROBUST NETWORK PROVIDER ---
        class PeerJsProvider {
            constructor(doc, peer) {
                this.doc = doc;
                this.peer = peer;
                this.connections = new Map(); // peerId -> conn

                // Listen for local Yjs updates and broadcast them
                doc.on('update', (update, origin) => {
                    if (origin !== this) {
                        this.broadcast({ type: 'sync-update', data: Array.from(update) });
                    }
                });

                peer.on('connection', (conn) => this.handleConnection(conn));
                
                // Heartbeat to keep connections alive
                setInterval(() => this.broadcast({ type: 'ping' }), 3000);
            }

            connectTo(remotePeerId) {
                console.log("Attempting to connect to host:", remotePeerId);
                const conn = this.peer.connect(remotePeerId, { reliable: true });
                this.handleConnection(conn);
                
                // Connection Timeout Fallback
                setTimeout(() => {
                    if(!conn.open) {
                        showError("Connection timed out. Host might be offline.");
                    }
                }, 8000);
            }

            handleConnection(conn) {
                conn.on('open', () => {
                    console.log("Connection opened:", conn.peer);
                    this.connections.set(conn.peer, conn);
                    updateStatus(this.connections.size);
                    hideError();
                    
                    // 1. Send Initial Sync
                    const stateVector = Y.encodeStateVector(this.doc);
                    conn.send({ type: 'sync-step-1', data: Array.from(stateVector) });

                    // 2. Announce Self
                    conn.send({ type: 'announce-user', user: { id: this.peer.id, ...currentUser } });
                    
                    if (isHost) {
                        conn.on('close', () => {
                            this.connections.delete(conn.peer);
                            yUsers.delete(conn.peer);
                            updateStatus(this.connections.size);
                        });
                    }
                });

                conn.on('data', (msg) => this.handleMessage(conn, msg));
                
                conn.on('close', () => {
                    console.log("Connection closed:", conn.peer);
                    this.connections.delete(conn.peer);
                    updateStatus(this.connections.size);
                    if(!isHost && this.connections.size === 0) {
                        showError("Disconnected from Host.");
                    }
                });
                
                conn.on('error', (err) => {
                    console.error("Conn Error:", err);
                    if(!isHost) showError("Connection error.");
                });
            }

            handleMessage(conn, msg) {
                if (typeof msg !== 'object') return;

                switch (msg.type) {
                    case 'sync-step-1':
                        const targetStateVector = new Uint8Array(msg.data);
                        const diff = Y.encodeStateAsUpdate(this.doc, targetStateVector);
                        if (diff.byteLength > 0) {
                            conn.send({ type: 'sync-update', data: Array.from(diff) });
                        }
                        break;
                    case 'sync-update':
                        Y.applyUpdate(this.doc, new Uint8Array(msg.data), this);
                        break;
                    case 'announce-user':
                        if (isHost) yUsers.set(msg.user.id, msg.user);
                        break;
                    case 'ping':
                        // Heartbeat received, connection is good.
                        break;
                }
            }

            broadcast(msg) {
                this.connections.forEach(conn => {
                    if (conn.open) conn.send(msg);
                });
            }
        }

        // --- 4. INITIALIZATION & ERROR HANDLING ---
        const peer = new Peer(null, { 
            debug: 1,
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });
        
        let provider;

        peer.on('open', (id) => {
            console.log("My Peer ID:", id);
            provider = new PeerJsProvider(doc, peer);

            if (isHost) {
                document.getElementById('peerIdDisplay').innerText = "Host ID: " + id;
                window.history.replaceState(null, null, `${window.location.pathname}?id=${id}`);
                yUsers.set(id, { id, ...currentUser });
                updateStatus(0);
            } else {
                document.getElementById('peerIdDisplay').innerText = "Guest Mode";
                if(hostId) {
                    provider.connectTo(hostId);
                } else {
                    showError("No Host ID found in URL.");
                }
            }
        });

        peer.on('error', (err) => {
            console.error("PeerJS Error:", err.type, err);
            if(err.type === 'peer-unavailable') {
                showError("Host not found. ID might be invalid or host is offline.");
            } else if (err.type === 'network') {
                showError("Network error. Lost connection to server.");
            } else {
                showError(`Error: ${err.type}`);
            }
        });

        peer.on('disconnected', () => {
            console.log("Disconnected from signalling server. Reconnecting...");
            // Attempt auto-reconnect to signaling server
            peer.reconnect();
        });

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.style.display = 'block';
            el.innerText = msg;
            document.getElementById('statusDot').className = "dot error-dot";
            document.getElementById('statusText').innerText = "Error";
        }
        
        function hideError() {
            document.getElementById('errorMsg').style.display = 'none';
        }

        function updateStatus(count) {
            const text = document.getElementById('statusText');
            const dot = document.getElementById('statusDot');
            
            // Host is always "online" if peer is open. Guest is online if connected to host (count > 0).
            if ((isHost && !peer.disconnected) || (!isHost && count > 0)) {
                text.innerText = isHost ? `Hosting (${count})` : `Connected`;
                dot.className = "dot connected";
            } else {
                text.innerText = "Waiting...";
                dot.className = "dot";
            }
        }

        // --- 5. UI: USER LIST ---
        yUsers.observe(() => {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '';
            
            yUsers.forEach((user, key) => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `
                    <div class="user-color-indicator" style="background:${user.uiColor}"></div>
                    <span>${user.name} ${user.id === peer.id ? '(You)' : ''}</span>
                `;
                container.appendChild(div);
            });
        });

        // --- 6. CANVAS & INTERACTION ---
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const colorInput = document.getElementById('colorPicker');
        let pointers = new Map();
        let camera = { x: 0, y: 0, zoom: 1 };
        
        let currentStrokeYArray = null;
        let isPanning = false;
        let lastPinchDist = 0;
        let lastMidpoint = null;

        yStrokes.observeDeep(() => requestAnimationFrame(render));

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        }
        window.onresize = resize;
        resize();

        function screenToWorld(sx, sy) {
            return { x: (sx - camera.x) / camera.zoom, y: (sy - camera.y) / camera.zoom };
        }

        function getMidpoint(p1, p2) {
            return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        }

        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const factor = 1 + (-e.deltaY * 0.001);
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const newZoom = Math.min(Math.max(camera.zoom * factor, 0.1), 10);
            camera.x = mouseX - (mouseX - camera.x) * (newZoom / camera.zoom);
            camera.y = mouseY - (mouseY - camera.y) * (newZoom / camera.zoom);
            camera.zoom = newZoom;
            render();
        }, { passive: false });

        canvas.addEventListener('pointerdown', e => {
            canvas.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (e.button === 1) { isPanning = true; return; }
            if (pointers.size === 2) { currentStrokeYArray = null; return; }

            if (pointers.size === 1 && e.button === 0 && !isPanning) {
                doc.transact(() => {
                    const newStrokeMap = new Y.Map();
                    const newPointsArray = new Y.Array();
                    newStrokeMap.set('color', colorInput.value);
                    newStrokeMap.set('points', newPointsArray);
                    
                    const worldPos = screenToWorld(e.clientX, e.clientY);
                    const pressure = e.pressure !== 0.5 && e.pressure > 0 ? e.pressure : 0.5;
                    newPointsArray.push([{ x: worldPos.x, y: worldPos.y, p: pressure }]);

                    yStrokes.push([newStrokeMap]);
                    currentStrokeYArray = newPointsArray;
                });
            }
        });

        canvas.addEventListener('pointermove', e => {
            if (!pointers.has(e.pointerId)) return;
            const p = pointers.get(e.pointerId);

            if (isPanning) {
                camera.x += e.clientX - p.x;
                camera.y += e.clientY - p.y;
                render();
            } else if (pointers.size === 1 && currentStrokeYArray) {
                const worldPos = screenToWorld(e.clientX, e.clientY);
                const pressure = e.pressure !== 0.5 && e.pressure > 0 ? e.pressure : 0.5;
                currentStrokeYArray.push([{ x: worldPos.x, y: worldPos.y, p: pressure }]);
            } else if (pointers.size === 2) {
                const pts = Array.from(pointers.values());
                if (pts[0] === p) { pts[0].x = e.clientX; pts[0].y = e.clientY; }
                else { pts[1].x = e.clientX; pts[1].y = e.clientY; }
                
                const midpoint = getMidpoint(pts[0], pts[1]);
                const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);

                if (lastMidpoint && lastPinchDist > 0) {
                    camera.x += midpoint.x - lastMidpoint.x;
                    camera.y += midpoint.y - lastMidpoint.y;
                    
                    const factor = dist / lastPinchDist;
                    const newZoom = Math.min(Math.max(camera.zoom * factor, 0.1), 10);
                    camera.x = midpoint.x - (midpoint.x - camera.x) * (newZoom / camera.zoom);
                    camera.y = midpoint.y - (midpoint.y - camera.y) * (newZoom / camera.zoom);
                    camera.zoom = newZoom;
                }
                lastMidpoint = midpoint;
                lastPinchDist = dist;
                render();
            }
            p.x = e.clientX;
            p.y = e.clientY;
        });

        canvas.addEventListener('pointerup', e => {
            pointers.delete(e.pointerId);
            currentStrokeYArray = null;
            if (pointers.size < 2) { lastPinchDist = 0; lastMidpoint = null; }
            if (e.button === 1) isPanning = false;
        });

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            yStrokes.forEach(strokeMap => {
                const points = strokeMap.get('points');
                if (!points || points.length < 2) return;
                const pts = points.toArray();
                ctx.strokeStyle = strokeMap.get('color') || '#000';
                
                ctx.beginPath();
                for (let i = 1; i < pts.length; i++) {
                    const p1 = pts[i - 1];
                    const p2 = pts[i];
                    ctx.lineWidth = 1 + (p1.p * 10);
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            });
            ctx.restore();
        }

        window.copyLink = () => {
            navigator.clipboard.writeText(window.location.href);
            alert("Link copied!");
        };

        window.clearCanvas = () => {
            if(confirm("Clear canvas for everyone?")) {
                doc.transact(() => yStrokes.delete(0, yStrokes.length));
            }
        };

        window.newSession = () => {
            if(confirm("Start a brand new session?")) {
                window.location.href = window.location.pathname;
            }
        };
    </script>
</body>
</html>
